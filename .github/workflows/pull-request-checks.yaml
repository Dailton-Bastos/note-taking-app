name: 'Pull Request Checks'

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  lint-format:
    name: 'Lint and Format Checks'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js dependencies
        uses: ./.github/actions/setup-node-dependencies

      - name: Run lint and format checks
        run: pnpm turbo quality --affected

  test:
    name: 'Run Tests'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js dependencies
        uses: ./.github/actions/setup-node-dependencies

      - name: Run tests
        run: pnpm turbo test --affected

  build:
    name: 'Build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js dependencies
        uses: ./.github/actions/setup-node-dependencies

      - name: Run build
        run: pnpm turbo build --affected

  conventional-commits:
    name: 'Conventional Commits Check'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate all commits follow conventional commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.js
          failOnWarning: true
          helpUrl: https://www.conventionalcommits.org

  all-checks-pass:
    name: 'All Checks Pass'
    runs-on: ubuntu-latest
    needs:
      - lint-format
      - test
      - build
      - conventional-commits
    steps:
      - name: Verify all checks pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more checks have failed or been cancelled."
          exit 1

      - name: All checks passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "All checks have passed successfully."
