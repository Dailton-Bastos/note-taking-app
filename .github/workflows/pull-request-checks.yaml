name: 'Pull Request Checks'

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  # Job 1: Quality, Build, and Test (Consolidated for optimal caching)
  pipeline:
    name: 'Workspace Pipeline'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Required for Turborepo's git diff filtering

      - name: Set up Node.js dependencies
        uses: ./.github/actions/setup-node-dependencies

      # Runs root lint/format, package builds, and tests in optimal graph order
      - name: Run Pipeline Tasks
        run: pnpm turbo run //#quality build test --affected

  # Job 2: Validate git history separately
  conventional-commits:
    name: 'Conventional Commits Check'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Deep clone strictly required for history validation

      - name: Validate all commits follow conventional commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
          failOnWarnings: true
          helpUrl: https://conventionalcommits.org

  # Job 3: Protected branch status gate
  all-checks-pass:
    name: 'All Checks Pass'
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - pipeline
      - conventional-commits
    steps:
      - name: Verify all checks pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more pipeline checks have failed or been cancelled."
          exit 1

      - name: All checks passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "All checks have passed successfully."
