services:
  setup:
    container_name: setup
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: '${UID:-1000}'
        GID: '${GID:-1000}'
    user: root
    environment:
      CI: 'true'
    volumes:
      - .:/usr/src/app
      - root_node_modules:/usr/src/app/node_modules
      - api_node_modules:/usr/src/app/apps/api/node_modules
      - web_node_modules:/usr/src/app/apps/web/node_modules
      - schemas_node_modules:/usr/src/app/packages/schemas/node_modules
      - tailwind_config_node_modules:/usr/src/app/packages/tailwind-config/node_modules
      - typescript_config_node_modules:/usr/src/app/packages/typescript-config/node_modules
      - ui_node_modules:/usr/src/app/packages/ui/node_modules
      - vitest_config_node_modules:/usr/src/app/packages/vitest-config/node_modules
    command: >-
      sh -lc "chown -R ${UID:-1000}:${GID:-1000}
      /usr/src/app/node_modules
      /usr/src/app/apps/api/node_modules
      /usr/src/app/apps/web/node_modules
      /usr/src/app/packages/schemas/node_modules
      /usr/src/app/packages/tailwind-config/node_modules
      /usr/src/app/packages/typescript-config/node_modules
      /usr/src/app/packages/ui/node_modules
      /usr/src/app/packages/vitest-config/node_modules
      && su node -s /bin/sh -c 'pnpm install'"
    restart: 'no'

  workspace:
    container_name: workspace
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: '${UID:-1000}'
        GID: '${GID:-1000}'
    user: '${UID:-1000}:${GID:-1000}'
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
      - .:/usr/src/app
      - root_node_modules:/usr/src/app/node_modules
      - api_node_modules:/usr/src/app/apps/api/node_modules
      - web_node_modules:/usr/src/app/apps/web/node_modules
      - schemas_node_modules:/usr/src/app/packages/schemas/node_modules
      - tailwind_config_node_modules:/usr/src/app/packages/tailwind-config/node_modules
      - typescript_config_node_modules:/usr/src/app/packages/typescript-config/node_modules
      - ui_node_modules:/usr/src/app/packages/ui/node_modules
      - vitest_config_node_modules:/usr/src/app/packages/vitest-config/node_modules
    command: /bin/zsh -c "tail -f /dev/null"
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-lc',
          'test -d /usr/src/app/node_modules && test -f /usr/src/app/pnpm-lock.yaml',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: 'no'

  api:
    container_name: api
    build:
      context: .
      target: dev
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ./apps/api/.env
        required: true
    depends_on:
      workspace:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - root_node_modules:/usr/src/app/node_modules
      - api_node_modules:/usr/src/app/apps/api/node_modules
      - web_node_modules:/usr/src/app/apps/web/node_modules
      - schemas_node_modules:/usr/src/app/packages/schemas/node_modules
      - tailwind_config_node_modules:/usr/src/app/packages/tailwind-config/node_modules
      - typescript_config_node_modules:/usr/src/app/packages/typescript-config/node_modules
      - ui_node_modules:/usr/src/app/packages/ui/node_modules
      - vitest_config_node_modules:/usr/src/app/packages/vitest-config/node_modules
    ports:
      - '3000:3000'
    restart: unless-stopped

  web:
    container_name: web
    build:
      context: .
      target: dev
      dockerfile: apps/web/Dockerfile
    env_file:
      - path: ./apps/web/.env
        required: false
    depends_on:
      workspace:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - root_node_modules:/usr/src/app/node_modules
      - api_node_modules:/usr/src/app/apps/api/node_modules
      - web_node_modules:/usr/src/app/apps/web/node_modules
      - schemas_node_modules:/usr/src/app/packages/schemas/node_modules
      - tailwind_config_node_modules:/usr/src/app/packages/tailwind-config/node_modules
      - typescript_config_node_modules:/usr/src/app/packages/typescript-config/node_modules
      - ui_node_modules:/usr/src/app/packages/ui/node_modules
      - vitest_config_node_modules:/usr/src/app/packages/vitest-config/node_modules
    ports:
      - '5173:5173'
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app

networks:
  default:
    name: app-network
    driver: bridge

volumes:
  root_node_modules:
  api_node_modules:
  web_node_modules:
  schemas_node_modules:
  tailwind_config_node_modules:
  typescript_config_node_modules:
  ui_node_modules:
  vitest_config_node_modules:
